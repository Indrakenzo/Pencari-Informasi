    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #020617;

            0% { top: 0; }

            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(34, 211, 238, 0.2);

        ::-webkit-scrollbar-track { background: #020617; }

    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence } = FramerMotion;

        // Icons components proxy for Lucide
        const Icon = ({ name, ...props }) => {
            const LucideIcon = lucide.icons[name];
            return LucideIcon ? <LucideIcon {...props} /> : null;
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('phone');
            const [query, setQuery] = useState('');
            const [isSearching, setIsSearching] = useState(false);
            const [result, setResult] = useState(null);
            const [logs, setLogs] = useState(["System Online", "Terminal Ready..."]);
            const [uploadedImage, setUploadedImage] = useState(null);
            const [imagePreview, setImagePreview] = useState(null);
            const [isDemo, setIsDemo] = useState(true);

            const apiKey = ""; // Masukkan API Key di sini nanti

            const addLog = (msg) => {
                setLogs(prev => [`[${new Date().toLocaleTimeString()}] ${msg}`, ...prev.slice(0, 8)]);
            };

            const handleSearch = async (e) => {
                if (e) e.preventDefault();
                setIsSearching(true);
                addLog(`Inisialisasi pemindaian: ${query || 'Visual Analysis'}...`);

                // Simulasi delay untuk kesan "masa depan"
                await new Promise(resolve => setTimeout(resolve, 2500));

                if (!apiKey) {
                    addLog("Warning: Neural link (API Key) not found. Entering Simulation Mode.");
                    setResult(`--- DOSSIER INTELIJEN (SIMULASI) ---
Target: ${query || "Data Visual"}
Status: TERDETEKSI DI DARK WEB
Koordinat Terakhir: -5.1476, 119.4327 (Makassar Node)

Temuan Awal:
• Email terhubung ke 3 forum underground.
• Jejak digital ditemukan di platform 'Silentium-Shield' (Proxy detected).
• Risk Level: CRITICAL.

[SISTEM]: Harap masukkan API Key Gemini untuk mendapatkan analisis real-time dari Vigi AI.`);
                } else {
                    // Logika API Gemini asli (jika key ada)
                    try {
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: `Analisis OSINT untuk ${activeTab}: ${query}. Berikan detail teknis yang mendalam.` }] }]
                            })
                        });
                        const data = await response.json();
                        setResult(data.candidates[0].content.parts[0].text);
                    } catch (err) {
                        addLog("Error: Gagal menghubungkan ke satelit data.");
                    }
                }
                setIsSearching(false);
                addLog("Data terdekripsi. Menampilkan laporan.");
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setImagePreview(reader.result);
                        setUploadedImage(reader.result.split(',')[1]);
                        addLog("Aset visual berhasil diunggah ke buffer.");
                    };
                    reader.readAsDataURL(file);
                }
            };

            return (
                <div className="min-h-screen hud-grid flex flex-col relative overflow-hidden">
                    <div className="scanline"></div>
                    
                    {/* Header HUD */}
                    <header className="p-6 border-b border-cyan-500/30 flex justify-between items-center glass-panel z-20">
                        <div className="flex items-center gap-4">
                            <motion.div 
                                animate={{ rotate: 360 }}

                                <Icon name="Shield" className="w-6 h-6" />
                            </motion.div>
                            <div>

                                    <span>|</span>
                                    <span>OPERATOR: INDRAYAZA Z.</span>
                                </div>
                            </div>
                        </div>
                        <div className="hidden md:flex gap-4 text-right">
                            <div className="text-[10px] opacity-60">
                                <div>CPU LOAD: 24%</div>
                                <div>ENCRYPTION: AES-256</div>
                            </div>
                            <Icon name="Activity" className="w-8 h-8 text-cyan-400 animate-pulse" />
                        </div>
                    </header>

                    <main className="flex-1 p-4 md:p-8 grid grid-cols-1 lg:grid-cols-12 gap-6 z-10 overflow-y-auto">
                        
                        {/* Control Side */}
                        <div className="lg:col-span-4 flex flex-col gap-6">
                            <div className="glass-panel p-6 rounded-xl border-l-4 border-l-cyan-500">
                                <h2 className="text-xs font-bold uppercase mb-4 flex items-center gap-2">
                                    <Icon name="Terminal" className="w-4 h-4" /> Command Modules
                                </h2>
                                <div className="space-y-2">
                                    {[
                                        { id: 'phone', label: 'Phone Tracer', icon: 'Phone' },
                                        { id: 'email', label: 'Email Breach', icon: 'Mail' },
                                        { id: 'username', label: 'Social Hunter', icon: 'User' },
                                        { id: 'image', label: 'Visual Vision', icon: 'Camera' }
                                    ].map(tab => (
                                        <button
                                            key={tab.id}
                                            onClick={() => { setActiveTab(tab.id); setResult(null); }}
                                            className={`w-full flex items-center gap-3 p-3 rounded-lg border transition-all ${
                                                activeTab === tab.id 
                                                ? 'bg-cyan-500/20 border-cyan-500 text-white shadow-[0_0_15px_rgba(6,182,212,0.2)]' 
                                                : 'border-transparent hover:bg-white/5 text-cyan-700'
                                            }`}
                                        >
                                            <Icon name={tab.icon} className="w-4 h-4" />
                                            <span className="text-sm font-bold uppercase">{tab.label}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Logs Panel */}
                            <div className="glass-panel p-4 rounded-xl flex-1 max-h-[300px] overflow-hidden flex flex-col">
                                <h2 className="text-[10px] uppercase opacity-50 mb-2">Live Telemetry Log</h2>
                                <div className="flex-1 overflow-y-auto space-y-1 font-mono text-[10px]">
                                    {logs.map((log, i) => (
                                        <div key={i} className={i === 0 ? "text-cyan-300" : "text-cyan-800"}>
                                            {log}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* Search & Result Side */}
                        <div className="lg:col-span-8 flex flex-col gap-6">
                            <form onSubmit={handleSearch} className="glass-panel p-6 rounded-xl relative group">
                                <div className="absolute top-0 right-0 p-2 text-[8px] opacity-30">SECURE_TUNNEL_ACTIVE</div>
                                <div className="mb-4">
                                    <label className="text-[10px] uppercase tracking-widest text-cyan-600 block mb-2">
                                        Target {activeTab} Data Entry
                                    </label>

                                        </div>
                                    ) : (
                                        <div className="relative">
                                            <input 
                                                type="text" 
                                                value={query}
                                                onChange={(e) => setQuery(e.target.value)}
                                                className="w-full bg-black/40 border border-cyan-900 focus:border-cyan-500 rounded-lg p-4 pl-12 text-white outline-none transition-all"
                                                placeholder={`Masukkan ${activeTab}...`}
                                            />
                                            <Icon name="Search" className="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-cyan-800" />
                                        </div>
                                    )}
                                </div>
                                <button 
                                    disabled={isSearching}
                                    className="w-full bg-cyan-600 hover:bg-cyan-500 disabled:bg-cyan-900 text-black font-bold p-4 rounded-lg uppercase tracking-widest text-xs transition-all shadow-[0_0_20px_rgba(6,182,212,0.4)]"
                                >
                                    {isSearching ? 'Executing Search Protocols...' : 'Start Intelligence Scan'}
                                </button>
                            </form>

                            {/* Result Area */}
                            <AnimatePresence>
                                {result && (
                                    <motion.div 
                                        initial={{ opacity: 0, y: 20 }}
                                        animate={{ opacity: 1, y: 0 }}
                                        className="glass-panel rounded-xl overflow-hidden flex flex-col flex-1"
                                    >
                                        <div className="bg-cyan-500/10 p-4 border-b border-cyan-500/20 flex justify-between">
                                            <span className="text-xs font-bold uppercase italic">Dossier: Verified Data</span>
                                            <Icon name="Eye" className="w-4 h-4" />
                                        </div>
                                        <div className="p-6 md:p-8 overflow-y-auto flex-1 font-mono text-sm leading-relaxed whitespace-pre-wrap">
                                            {result}
                                        </div>
                                        <div className="p-4 bg-black/20 border-t border-cyan-500/10 text-[10px] flex gap-4 italic opacity-50">
                                            <span>SHIELD_ENCRYPTED</span>
                                            <span>|</span>
                                            <span>VIGI_AI_APPROVED</span>
                                        </div>
                                    </motion.div>
                                )}
                            </AnimatePresence>
                        </div>
                    </main>

                    {/* Footer HUD */}
                    <footer className="p-4 border-t border-cyan-900/30 text-[8px] flex justify-between items-center glass-panel">
                        <div className="flex gap-4">
                            <span>GRID_STATUS: NOMINAL</span>
                            <span>DATABASE: GLOBAL_OSINT_NODE</span>
                        </div>
                        <div className="text-right uppercase">
                            Property of The Silentium Shield &copy; 2026
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
